{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<div class="row g-0">
  <div class="col-3 bg-white vh-100 p-3">
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-speedometer2"></i> Overview</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'notifications' %}"><i class="bi bi-bell"></i> Notifications</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}"><i class="bi bi-person"></i> Profile</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'change_password' %}"><i class="bi bi-key"></i> Change Password</a></li>
    </ul>
  </div>
  <div class="col-9 p-4">
<div class="form-wrapper">
  <div class="card w-75">
    <div class="card-header">Dashboard Overview</div>
<div class="progress" style="height: 20px;">
  <div class="progress-bar" role="progressbar" style="width: {{ percent }}%;" aria-valuenow="{{ percent }}" aria-valuemin="0" aria-valuemax="100">{{ percent }}%</div>
</div>
    <div class="card-body">
      <canvas id="activityChart"></canvas>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('activityChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: {{ chart_data.labels|safe }},
        datasets: [{
            label: 'Logins per day',
            data: {{ chart_data.data|safe }},
            backgroundColor: 'rgba(40,81,163,0.6)'
        }]
    },
    options: { responsive: true }
});
</script>
{% endblock %}
