{% load static %}
{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="form-wrapper">
  <div class="card w-50 mx-auto">
    <div class="card-header">Settings</div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="notif" id="notif" checked>
          <label class="form-check-label" for="notif">Email Notifications</label>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="weekly" id="weekly">
          <label class="form-check-label" for="weekly">Weekly Summary</label>
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
