{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="form-wrapper">
  <div class="card w-50">
    <div class="card-header">Profile</div>
    <div class="card-body">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <div class="text-center mb-3">
        <img src="{{ request.user.profile.avatar.url }}" class="rounded-circle" width="120" height="120" alt="Avatar">
      </div>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label>First Name</label>
          <input type="text" class="form-control" name="fname" value="{{ request.user.first_name }}" required>
        </div>
        <div class="mb-3">
          <label>Last Name</label>
          <input type="text" class="form-control" name="lname" value="{{ request.user.last_name }}" required>
        </div>
        <div class="mb-3">
          <label>Avatar</label>
          <input type="file" class="form-control" name="avatar">
        </div>
        <button type="submit" class="btn btn-primary">Update Profile</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
